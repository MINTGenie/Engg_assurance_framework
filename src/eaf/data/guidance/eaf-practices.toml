# EAF default guidance pack.
#
# Everything a developer is told by EAF comes from this file: which engineering practices
# are looked for, why they matter, how to adopt them, and how to fix scanner findings.
# To adapt it, do not edit this file. Create your own pack:
#
#   [guidance]
#   id = "my-team-practices"
#   version = "1.0.0"
#   extends = "eaf-practices"          # start from this pack
#   disable = ["docs.changelog"]       # drop practices (globs allowed)
#
#   [[practice]]                       # same id = replace, new id = add
#   id = "spec.present"
#   ...
#
# and select it with `eaf assess --guidance my-pack.toml` or `[assessment] guidance = "..."`.
#
# Practice fields
#   id, title, severity (info|low|medium|high|critical)
#   applies_when   any of: code, api, database, vector, mcp, ai_assisted, git  (default: code)
#   paths          globs, case-insensitive; the practice is evidenced if any file matches
#   min_words      matched text files must contain at least this many words in total
#   content_any    regexes; at least one matched file must contain one of them
#   content_label  human description of content_any
#   readme_sections  list of {name, pattern}; pattern must match a README heading
#   freshness      {docs = [globs], max_lag_days = N}; compares last commit dates
#   why, how       guidance text shown with the finding
#   references     free-text references shown with the finding
#
# These checks establish that an artefact EXISTS and has minimal substance. They cannot
# judge whether a specification is correct or whether the code actually follows it.

[guidance]
id = "eaf-practices"
version = "1.0.0"
title = "EAF engineering practice and remediation guidance"

# ============================== specification-driven development ==========================

[[practice]]
id = "spec.present"
title = "A written specification exists"
severity = "medium"
paths = ["spec/*", "specs/*", "docs/spec*", "docs/specs/*", "docs/requirements*", "requirements/*",
         "docs/prd*", "prd.md", "spec.md", "specification.md", "requirements.md", "*.spec.md",
         "*.feature", ".kiro/specs/*", ".specify/*", "openspec/*", "docs/user-stories*",
         "docs/use-cases*"]
min_words = 150
why = "Without a written specification nobody can tell whether the code does what was intended, and reviewers of AI-generated code have nothing to review against."
how = "Before changing code, write or update a short spec per feature (for example specs/<feature>.md): the problem, the intended behaviour, inputs and outputs, error cases, and what is explicitly out of scope. Give the spec to the AI assistant as the task input instead of a one-line prompt, and change the spec first when requirements change."
references = ["Spec-driven development", "ISO/IEC/IEEE 29148 (requirements engineering)"]

[[practice]]
id = "spec.acceptance-criteria"
title = "Specifications contain testable acceptance criteria"
severity = "low"
paths = ["spec/*", "specs/*", "docs/spec*", "docs/specs/*", "docs/requirements*", "requirements/*",
         "docs/prd*", "prd.md", "spec.md", "specification.md", "requirements.md", "*.spec.md",
         "*.feature", ".kiro/specs/*", ".specify/*", "openspec/*"]
content_any = ['acceptance criteri', '^\s*(given|when|then)\b', '\b(REQ|FR|NFR|US|AC)[-_ ]?\d+',
               '\b(shall|must)\b.{10,}', 'akzeptanzkriteri']
content_label = "acceptance criteria, Given/When/Then scenarios or numbered requirements"
why = "A spec that cannot be tested cannot be verified. Acceptance criteria are what turns a description into something a test or a reviewer can check."
how = "For each requirement add acceptance criteria that can be checked: numbered requirements (REQ-001 ...) or Given/When/Then scenarios. Reference the requirement id in the test that covers it."
references = ["Spec-driven development", "Behaviour-driven development (Gherkin)"]

# ===================================== documentation =====================================

[[practice]]
id = "docs.readme-sections"
title = "README explains purpose, setup, usage and testing"
severity = "low"
readme_sections = [
  { name = "what the project is / purpose", pattern = '(about|overview|purpose|introduction|what is|features|beschreibung|^#\s+\S)' },
  { name = "setup / installation", pattern = '(install|setup|set up|getting started|quick ?start|prerequisite|requirements|development|einrichtung)' },
  { name = "usage / how to run", pattern = '(usage|how to (use|run)|running|run |quick ?start|getting started|commands|scripts|nutzung|verwendung)' },
  { name = "testing", pattern = '(test|quality|verification|ci\b)' },
]
why = "A new team member, a reviewer or an auditor should be able to build, run and test the project from the README alone."
how = "Add the missing sections to README.md. Keep each to a few lines with the exact commands. When you change how the project is built, run or tested, update the README in the same change."

[[practice]]
id = "docs.architecture"
title = "Architecture or design decisions are documented"
severity = "low"
paths = ["docs/architecture*", "architecture.md", "docs/design*", "design.md", "docs/adr/*", "adr/*",
         "docs/decisions/*", "docs/arc42*", "docs/c4*", "*.puml", "docs/*.drawio", "docs/system*",
         "docs/technical*"]
min_words = 100
why = "Structure that exists only in the code (or only in an AI chat history) is lost. Undocumented architecture is the main reason generated code drifts into inconsistency."
how = "Add docs/architecture.md with the main components, their responsibilities, data flow and external interfaces. Record significant decisions as short ADRs (docs/adr/0001-<title>.md: context, decision, consequences) at the time they are made."
references = ["arc42", "Architecture Decision Records (ADR)", "ISO/IEC/IEEE 42010"]

[[practice]]
id = "docs.changelog"
title = "Changes are recorded (changelog or release notes)"
severity = "low"
paths = ["changelog*", "changes.md", "history.md", "release-notes*", "releases.md", "docs/changelog*",
         "docs/release*", ".changeset/*"]
why = "Users and reviewers need to know what changed between versions without reading every commit."
how = "Add CHANGELOG.md in 'Keep a Changelog' format and add an entry in the same change that alters behaviour. Use semantic versioning for releases."
references = ["Keep a Changelog", "Semantic Versioning 2.0.0"]

[[practice]]
id = "docs.contribution-process"
title = "Contribution and review process is defined"
severity = "low"
paths = ["contributing*", "docs/contributing*", ".github/pull_request_template*",
         ".github/PULL_REQUEST_TEMPLATE/*", "codeowners", ".github/codeowners", "docs/codeowners",
         ".gitlab/merge_request_templates/*", "docs/development*", "docs/workflow*"]
why = "Generated code needs the same review as hand-written code. A defined process (who reviews, what must be true before merge) is what makes that enforceable."
how = "Add CONTRIBUTING.md (branching, commit and review rules, definition of done), a pull request template with a checklist (spec updated, tests added, EAF run attached) and a CODEOWNERS file."

[[practice]]
id = "docs.security-policy"
title = "Security policy or threat model is documented"
severity = "low"
paths = ["security.md", ".github/security.md", "docs/security*", "docs/threat*", "threat-model*",
         "docs/tara*"]
why = "IT security reviewers ask first how vulnerabilities are reported and which threats were considered. Without a document the answer is 'none'."
how = "Add SECURITY.md (how to report a vulnerability, supported versions) and, for anything networked, a short threat model: assets, entry points, trust boundaries, and the mitigations you rely on."
references = ["OWASP Threat Modeling", "ISO/SAE 21434 (TARA) for vehicle-related items"]

[[practice]]
id = "docs.freshness"
title = "Documentation is updated together with the code"
severity = "low"
applies_when = ["code", "git"]
freshness = { docs = ["readme*", "docs/*", "spec/*", "specs/*", "*.md"], max_lag_days = 90 }
why = "Stale documentation is worse than none: it is trusted and wrong."
how = "Update the affected spec and docs in the same pull request as the code. Add 'docs/spec updated or not needed' to the pull request checklist."

[[practice]]
id = "docs.api-contract"
title = "The REST API has a machine-readable contract (OpenAPI)"
severity = "medium"
applies_when = ["api"]
paths = ["openapi*.json", "openapi*.yaml", "openapi*.yml", "swagger*.json", "swagger*.yaml",
         "swagger*.yml", "*.openapi.json", "*.openapi.yaml", "docs/api/*", "api/*.yaml", "api/*.json",
         "*.proto", "asyncapi*"]
why = "An API without a contract cannot be reviewed, tested against, or inventoried. Undocumented endpoints are a recurring source of incidents (OWASP API9:2023)."
how = "Write the OpenAPI document first (or export it from the framework and commit it), declare authentication for every operation, and review API changes as changes to that document."
references = ["OpenAPI Specification 3.x", "OWASP API Security Top 10 2023 - API9"]

[[practice]]
id = "docs.data-model"
title = "Database schema changes are versioned migrations"
severity = "medium"
applies_when = ["database"]
paths = ["*/migrations/*", "migrations/*", "db/migrate/*", "alembic/*", "prisma/schema.prisma",
         "drizzle/*", "schema.sql", "db/schema*", "docs/data-model*", "docs/schema*", "*/flyway/*",
         "liquibase*"]
why = "A schema that is changed by hand cannot be reproduced, reviewed or rolled back, and access rules (grants, row level security) end up undocumented."
how = "Keep every schema change as a migration file under version control, including access rules. Never edit the database directly; never edit a migration that has been applied."

[[practice]]
id = "docs.mcp-tools"
title = "MCP servers and their tools are documented"
severity = "low"
applies_when = ["mcp"]
paths = ["docs/mcp*", "mcp.md", "docs/tools*", "docs/agents*", "readme*"]
content_any = ['\bMCP\b', 'model context protocol']
content_label = "a description of the MCP server, its tools and required permissions"
why = "An MCP tool is an API that an AI agent can call on its own. Reviewers need to know which tools exist, what data and systems they can reach, and with which credentials."
how = "Document each MCP server: transport, authentication, every tool with its inputs, side effects and the permissions/tokens it uses. Treat adding a tool as an API change that needs review."

# ================================ AI-assisted development ================================

[[practice]]
id = "ai.agent-instructions"
title = "AI coding assistants have project instructions"
severity = "low"
applies_when = ["code", "ai_assisted"]
paths = ["agents.md", "claude.md", ".github/copilot-instructions.md", ".github/instructions/*",
         ".cursor/rules/*", ".cursorrules", ".windsurfrules", ".clinerules", "gemini.md",
         ".github/skills/*", ".claude/*"]
min_words = 80
why = "Without project rules an assistant falls back to generic patterns. That is what produces inconsistent structure, duplicated helpers and unreviewed dependencies."
how = "Add AGENTS.md (or .github/copilot-instructions.md) stating: where the spec lives and that it must be read first, architecture rules, coding conventions, how to run tests and EAF, what the assistant must not do (add dependencies, change schemas, weaken checks) without asking."

# ================================= remediation guidance ==================================
# First matching entry wins. `check` and `rule` are globs; `rule` is case-sensitive.

[[remediation]]
check = "secrets.*"
guidance = "Remove the value from source, rotate it (assume it is compromised once committed), and load it from the environment or a secret store. Add the file pattern to .gitignore. If it is a public/publishable identifier or a test fixture, add a suppression with that reason."
standards = ["OWASP-2021-A07", "CWE-798"]

[[remediation]]
check = "dependencies.pinning"
guidance = "Pin dependencies to exact versions and commit the lockfile so every build resolves the same packages."
standards = ["OWASP-2021-A06", "OWASP-2021-A08"]

[[remediation]]
check = "dependencies.*"
guidance = "Upgrade to a fixed version. If no fix exists, check whether the vulnerable function is reachable, document the decision, and track it."
standards = ["OWASP-2021-A06", "OWASP-API-2023-API10", "CWE-1395"]

[[remediation]]
check = "security.bandit"
rule = "B60[2-9]"
guidance = "Pass the command as an argument list without a shell, and validate any value that comes from outside the process."
standards = ["OWASP-2021-A03"]

[[remediation]]
check = "security.bandit"
rule = "B608"
guidance = "Use parameterised queries; never build SQL with string formatting or concatenation."
standards = ["OWASP-2021-A03"]

[[remediation]]
check = "security.bandit"
rule = "B30[1-9]"
guidance = "Do not deserialise or evaluate untrusted data. Use a data-only format (JSON) with schema validation, or ast.literal_eval for literals."
standards = ["OWASP-2021-A08"]

[[remediation]]
check = "security.bandit"
rule = "B506"
guidance = "Use yaml.safe_load."
standards = ["OWASP-2021-A08"]

[[remediation]]
check = "security.bandit"
rule = "B32[0-9]"
guidance = "Use SHA-256 or stronger. If the hash is not used for security, pass usedforsecurity=False."
standards = ["OWASP-2021-A02"]

[[remediation]]
check = "security.flawfinder"
guidance = "Replace unbounded C string functions with length-checked ones (snprintf, strlcpy, fgets) and check every length against the destination size."
standards = ["CERT C STR31-C"]

[[remediation]]
check = "quality.cppcheck"
guidance = "Fix the reported defect. If cppcheck lacks build context, provide a compile_commands.json (Level 2) before dismissing it."
standards = ["CERT C"]

[[remediation]]
check = "quality.eslint-*"
rule = "no-eval"
guidance = "Remove eval. Parse data with JSON.parse; for expressions use a dedicated, sandboxed parser."
standards = ["OWASP-2021-A03", "CWE-95"]

[[remediation]]
check = "quality.eslint-*"
rule = "no-new-func"
guidance = "Do not build functions from strings; it is equivalent to eval."
standards = ["OWASP-2021-A03", "CWE-95"]

[[remediation]]
check = "quality.eslint-*"
rule = "complexity"
guidance = "Split the function: extract branches into named helpers, replace nested conditions with early returns or lookup tables. High complexity is typical of code that was generated in one pass and never refactored."

[[remediation]]
check = "quality.ruff"
rule = "C901"
guidance = "Split the function into smaller units with one responsibility each."

[[remediation]]
check = "quality.ruff"
rule = "F40[35]"
guidance = "Replace 'from x import *' with explicit imports so names can be traced."

[[remediation]]
check = "quality.squawk"
guidance = "Make the migration safe to run against a live database: set lock/statement timeouts, create indexes concurrently, add constraints as NOT VALID then validate, and make statements re-runnable (IF NOT EXISTS)."

[[remediation]]
check = "hygiene.tests-present"
guidance = "Add automated tests next to the code and derive them from the acceptance criteria in the spec. Ask the AI assistant for tests per requirement id, then review that they fail when the behaviour is broken."

[[remediation]]
check = "hygiene.ci-config"
guidance = "Add a CI pipeline that runs build, tests and `eaf assess --fail-on fail` on every pull request."

[[remediation]]
check = "hygiene.tracked-artifacts"
guidance = "Remove generated files from version control (git rm --cached) and add the pattern to .gitignore."

[[remediation]]
check = "hygiene.license"
guidance = "Add a LICENSE or NOTICE file that states ownership and terms. For internal code, state that explicitly."

