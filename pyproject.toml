[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaf"
version = "0.1.0"
description = "Engineering Assurance Framework (EAF) - Level 1 source assessment prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - internal prototype" }
dependencies = []  # the core has no runtime dependencies; scanners are external tools

[project.optional-dependencies]
# Python-installable scanners. cppcheck, eslint and npm are installed via the OS / Node.
scanners = [
    "ruff>=0.4",
    "bandit>=1.7",
    "flawfinder>=2.0.19",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
]
dev = ["pytest>=7"]

[project.scripts]
eaf = "eaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eaf = ["data/*", "data/policies/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
